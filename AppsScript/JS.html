function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ============================================================================
// 2. SERVER BRIDGE (google.script.run Promise Wrapper)
// ============================================================================

function callServer(functionName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn(`[Local Fallback] Running ${functionName} outside Google Apps Script environment`);
      return resolve(clientLocalFallback(functionName, args));
    }

    google.script.run
      .withSuccessHandler((response) => resolve(response))
      .withFailureHandler((error) => {
        console.error(`Apps Script error in ${functionName}:`, error);
        reject(new Error(error && error.message ? error.message : String(error)));
      })
      [functionName](...args);
  });
}

function clientLocalFallback(fnName, args) {
  if (fnName === 'getHealth') {
    return {
      status: 'healthy',
      database: 'connected (Local Memory / Sheets Fallback)',
      engine: 'DURGA Client V8 Engine',
      scenarioCount: STATE.scenariosList.length,
      timestamp: new Date().toISOString(),
    };
  }
  if (fnName === 'getScenarios') {
    return STATE.scenariosList;
  }
  if (fnName === 'getLiveConditions') {
    return {
      gps: { lat: args[0], lon: args[1], status: 'LIVE' },
      weather: { temperatureC: 28, humidityPercent: 65, condition: 'Clear', status: 'LIVE' },
      hazards: { status: 'NO VERIFIED FEED' },
    };
  }
  if (fnName === 'askGemini') {
    return {
      text: '🤖 Gemini Advisory (Client Offline Preview): All primary arterial routes to EX01 remain operational. Prioritize civilian movement along City Hall Egress Corridor.'
    };
  }
  return null;
}

function switchTab(tabId) {
  STATE.activeTab = tabId;

  document.querySelectorAll('.nav-item').forEach((item) => {
    item.classList.toggle('active', item.getAttribute('data-tab') === tabId);
  });

  document.querySelectorAll('.tab-pane').forEach((pane) => {
    pane.classList.toggle('active', pane.id === `tab-${tabId}`);

  if (tabId === 'explorer' || tabId === 'evacuation' || tabId === 'algorithms') {
    requestAnimationFrame(() => renderGraphCanvas());
  }
}

// ============================================================================
// 4. INTERACTIVE SVG GRAPH RENDERER & INSPECTOR
// ============================================================================

function renderGraphCanvas() {
  const svg = document.getElementById('network-svg');
  if (!svg || !STATE.graph) return;

  const g = document.getElementById('network-viewport-group');
  if (!g) return;

  // Apply Pan/Zoom transform
  g.setAttribute('transform', `translate(${STATE.graphView.panX}, ${STATE.graphView.panY}) scale(${STATE.graphView.zoom})`);

  // Clear previous dynamic content
  g.innerHTML = '';

  const nodes = STATE.graph.nodes;
  const edges = STATE.graph.edges;
  const nodeMap = new Map(nodes.map((n) => [n.id, n]));

  // 1. Render Edges
  edges.forEach((edge) => {
    const s = nodeMap.get(edge.source);
    const t = nodeMap.get(edge.target);
    if (!s || !t) return;

    const isPath = isEdgeInActivePath(edge.id);
    const isBlocked = edge.blocked;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', s.x);
    line.setAttribute('y1', s.y);
    line.setAttribute('x2', t.x);
    line.setAttribute('y2', t.y);
    line.setAttribute('stroke', isBlocked ? '#ef4444' : isPath ? '#16a34a' : '#cbd5e1');
    line.setAttribute('stroke-width', isPath ? '5' : isBlocked ? '3' : '2');
    line.setAttribute('stroke-linecap', 'round');
    if (isBlocked) line.setAttribute('stroke-dasharray', '6,4');
    line.style.cursor = 'pointer';

    line.addEventListener('click', (e) => {
      e.stopPropagation();
      inspectEdge(edge);
    });

    g.appendChild(line);
  });

  // 2. Render Nodes
  nodes.forEach((node) => {
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('transform', `translate(${node.x}, ${node.y})`);
    group.style.cursor = 'pointer';

    const shape = getNodeShapeSvg(node);
    group.appendChild(shape);

    // Label
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('y', 20);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '10px');
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', '#334155');
    text.textContent = node.id;
    group.appendChild(text);

    group.addEventListener('click', (e) => {
      e.stopPropagation();
      inspectNode(node);
    });

    g.appendChild(group);
  });
}

function getNodeShapeSvg(node) {
  const isOrigin = node.id === STATE.selectedOrigin;
  const isExit = node.type === 'exit';
  const isHospital = node.type === 'hospital';
  const isZone = node.type === 'zone';

  let fill = '#64748b';
  let stroke = '#ffffff';

  if (isExit) { fill = '#15803d'; stroke = '#bbf7d0'; }
  else if (isHospital) { fill = '#dc2626'; stroke = '#fecaca'; }
  else if (isZone) { fill = '#f59e0b'; stroke = '#fef08a'; }
  else if (node.type === 'resource_center') { fill = '#0284c7'; stroke = '#bae6fd'; }

  if (isOrigin) {
    fill = '#16a34a';
    stroke = '#22c55e';
  }

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', isExit || isOrigin ? '13' : '10');
  circle.setAttribute('fill', fill);
  circle.setAttribute('stroke', stroke);
  circle.setAttribute('stroke-width', '2.5');
  circle.setAttribute('filter', 'drop-shadow(0px 2px 3px rgba(0,0,0,0.15))');

  return circle;
}

function isEdgeInActivePath(edgeId) {
  if (!STATE.lastDijkstraResult || !STATE.lastDijkstraResult.edgePath) return false;
  return STATE.lastDijkstraResult.edgePath.includes(edgeId);
}

function initGraphCanvasInteractions() {
  const container = document.getElementById('graph-canvas-container');
  const svg = document.getElementById('network-svg');
  if (!container || !svg) return;

  container.addEventListener('mousedown', (e) => {
    STATE.graphView.isDragging = true;
    STATE.graphView.dragStart = { x: e.clientX - STATE.graphView.panX, y: e.clientY - STATE.graphView.panY };
  });

  window.addEventListener('mousemove', (e) => {
    if (!STATE.graphView.isDragging) return;
    STATE.graphView.panX = e.clientX - STATE.graphView.dragStart.x;
    STATE.graphView.panY = e.clientY - STATE.graphView.dragStart.y;
    renderGraphCanvas();
  });

  window.addEventListener('mouseup', () => {
    STATE.graphView.isDragging = false;
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    STATE.graphView.zoom = Math.max(0.4, Math.min(3.5, STATE.graphView.zoom * factor));
    renderGraphCanvas();
  });
}

function zoomGraph(delta) {
  STATE.graphView.zoom = Math.max(0.4, Math.min(3.5, STATE.graphView.zoom + delta));
  renderGraphCanvas();
}

function resetGraphView() {
  STATE.graphView.zoom = 1;
  STATE.graphView.panX = 0;
  STATE.graphView.panY = 0;
  renderGraphCanvas();
}

  const edge = STATE.graph.edges.find((e) => e.id === edgeId);
  if (edge) {
    edge.blocked = !edge.blocked;
    renderGraphCanvas();
    if (STATE.graphView.selectedEdge?.id === edgeId) inspectEdge(edge);
  }
}

function populateOriginDropdown() {
  const sel = document.getElementById('origin-select');
  if (!sel || !STATE.graph) return;
  sel.innerHTML = '';

  STATE.graph.nodes.forEach((n) => {
    const opt = document.createElement('option');
    opt.value = n.id;
    opt.textContent = `${n.id} - ${n.name} (${n.type})`;
    if (n.id === STATE.selectedOrigin) opt.selected = true;
    sel.appendChild(opt);
  });

  sel.addEventListener('change', (e) => {
    STATE.selectedOrigin = e.target.value;
    renderGraphCanvas();
    runEvacuationCalculation();
  });
}

function runEvacuationCalculation() {
  const originId = STATE.selectedOrigin;
  const exitId = document.getElementById('exit-select')?.value || null;

  // Run Dijkstra on the active graph
  const result = runLocalDijkstra(STATE.graph, originId, exitId === 'all' ? null : exitId);
  STATE.lastDijkstraResult = result;

  renderGraphCanvas();
  renderEvacuationMetrics(result);
  prepareVoiceInstructions(result);
}

function runLocalDijkstra(graph, sourceId, targetId = null) {
  const nodes = graph.nodes;
  const edges = graph.edges;

  const adj = new Map();
  nodes.forEach((n) => adj.set(n.id, []));

  edges.forEach((e) => {
    if (e.blocked) return;
    const cost = e.travelTime || (e.distance / ((e.speedKmh || 40) / 3.6));
    adj.get(e.source)?.push({ target: e.target, cost, edge: e });
    adj.get(e.target)?.push({ target: e.source, cost, edge: e });
  });

  const dist = new Map();
  const prev = new Map();
  const visited = new Set();
  nodes.forEach((n) => dist.set(n.id, Infinity));
  dist.set(sourceId, 0);

  const pq = [{ id: sourceId, dist: 0 }];

  while (pq.length > 0) {
    pq.sort((a, b) => a.dist - b.dist);
    const { id: u, dist: currentDist } = pq.shift();

    if (visited.has(u)) continue;
    visited.add(u);

    if (targetId && u === targetId) break;

    const neighbors = adj.get(u) || [];
    for (let i = 0; i < neighbors.length; i++) {
      const { target: v, cost: weight, edge } = neighbors[i];
      if (visited.has(v)) continue;

      const alt = currentDist + weight;
      if (alt < dist.get(v)) {
        dist.set(v, alt);
        prev.set(v, { node: u, edge });
        pq.push({ id: v, dist: alt });
      }
    }
  }

  let finalTarget = targetId;
  if (!finalTarget) {
    const exits = nodes.filter((n) => n.type === 'exit');
    let minCost = Infinity;
    exits.forEach((ex) => {
      const c = dist.get(ex.id) || Infinity;
      if (c < minCost) {
        minCost = c;
        finalTarget = ex.id;
      }
    });
  }

  const path = [];
  const edgePath = [];
  let curr = finalTarget;
  let totalDistance = 0;

  while (curr && prev.has(curr)) {
    path.unshift(curr);
    const p = prev.get(curr);
    edgePath.unshift(p.edge.id);
    totalDistance += p.edge.distance;
    curr = p.node;
  }
  if (path.length > 0 || curr === sourceId) path.unshift(sourceId);

  return {
    sourceId,
    targetExitId: finalTarget,
    totalCost: Number((dist.get(finalTarget) || 0).toFixed(1)),
    distance: totalDistance,
    path,
    edgePath,
  };
}

function initVoiceNavigation() {
  const hasSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  const startBtn = document.getElementById('nav-start-btn');
  const pauseBtn = document.getElementById('nav-pause-btn');
  const stopBtn = document.getElementById('nav-stop-btn');
  const instructionEl = document.getElementById('voice-current-instruction');

  if (!hasSpeech) {
    STATE.voiceNav.enabled = false;
    if (toggleBtn) {
      toggleBtn.textContent = '🔇 Voice: Not Supported';
      toggleBtn.disabled = true;
    }
    if (instructionEl) {
      instructionEl.textContent = 'Web Speech API is not supported in this browser.';
    }
    return;
  }

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      STATE.voiceNav.enabled = !STATE.voiceNav.enabled;
      toggleBtn.textContent = `🔊 Voice Guidance: ${STATE.voiceNav.enabled ? 'ON' : 'OFF'}`;
      if (!STATE.voiceNav.enabled) stopVoiceGuidance();
    });
  }

  if (startBtn) startBtn.addEventListener('click', startVoiceGuidance);
  if (pauseBtn) pauseBtn.addEventListener('click', pauseVoiceGuidance);
  if (stopBtn) stopBtn.addEventListener('click', stopVoiceGuidance);
}

function prepareVoiceInstructions(result) {
  if (!result || !result.path || result.path.length <= 1) return;
  const nodeMap = new Map(STATE.graph.nodes.map((n) => [n.id, n]));
  const steps = [];

  for (let i = 0; i < result.path.length - 1; i++) {
    const from = nodeMap.get(result.path[i]);
    const to = nodeMap.get(result.path[i + 1]);
    const edgeId = result.edgePath[i];
    const edge = STATE.graph.edges.find((e) => e.id === edgeId);

    const roadName = edge?.name || 'the designated emergency corridor';
    const dist = edge?.distance || 200;

    let instruction = '';
    if (i === 0) {
      instruction = `Commence evacuation from ${from?.name || 'origin'}. Proceed along ${roadName} for ${dist} meters.`;
    } else if (i === result.path.length - 2) {
      instruction = `Continue for ${dist} meters onto ${roadName}. Your evacuation exit ${to?.name || 'portal'} is ahead.`;
    } else {
      instruction = `Turn towards ${to?.name || 'waypoint'} onto ${roadName} and proceed for ${dist} meters.`;
    }
    steps.push(instruction);
  }
  steps.push('You have successfully reached the safe evacuation exit. Stand by for emergency personnel.');

  STATE.voiceNav.steps = steps;
  STATE.voiceNav.currentIndex = 0;
  updateVoiceUi();
}

function startVoiceGuidance() {
  if (!STATE.voiceNav.steps || STATE.voiceNav.steps.length === 0) {
    runEvacuationCalculation();
  }
  STATE.voiceNav.status = 'navigating';
  updateVoiceUi();
  speakNextInstruction();
}

function pauseVoiceGuidance() {
  STATE.voiceNav.status = 'paused';
  if (STATE.voiceNav.synth) STATE.voiceNav.synth.cancel();
  updateVoiceUi();
}

function stopVoiceGuidance() {
  STATE.voiceNav.status = 'idle';
  STATE.voiceNav.currentIndex = 0;
  if (STATE.voiceNav.synth) STATE.voiceNav.synth.cancel();
  updateVoiceUi();
}

function speakNextInstruction() {
  if (STATE.voiceNav.status !== 'navigating') return;
  if (!STATE.voiceNav.synth || !STATE.voiceNav.enabled) return;

  const idx = STATE.voiceNav.currentIndex;
  if (idx >= STATE.voiceNav.steps.length) {
    stopVoiceGuidance();
    return;
  }

  const text = STATE.voiceNav.steps[idx];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.0;
  utterance.pitch = 1.0;

  utterance.onend = () => {
    if (STATE.voiceNav.status === 'navigating') {
      STATE.voiceNav.currentIndex++;
      updateVoiceUi();
      if (STATE.voiceNav.currentIndex < STATE.voiceNav.steps.length) {
        setTimeout(speakNextInstruction, 2500); // 2.5s pacing
      } else {
        stopVoiceGuidance();
      }
    }
  };

  STATE.voiceNav.synth.speak(utterance);
}

function updateVoiceUi() {
  const textEl = document.getElementById('voice-current-instruction');
  const subEl = document.getElementById('voice-step-counter');
  const bars = document.querySelectorAll('.voice-bar');

  if (textEl) {
    const text = STATE.voiceNav.steps[STATE.voiceNav.currentIndex] || 'Voice guidance ready. Press Start Navigation.';
    textEl.textContent = text;
  }
  if (subEl) {
    subEl.textContent = STATE.voiceNav.status === 'navigating'
      ? `Step ${STATE.voiceNav.currentIndex + 1} of ${STATE.voiceNav.steps.length}`
      : 'Navigation Standby';
  }

  bars.forEach((b) => {
    b.classList.toggle('active', STATE.voiceNav.status === 'navigating');
  });
}

function initGeolocation() {
  if (!navigator.geolocation) {
    updateGpsBadge('GPS UNSUPPORTED', 'badge-static');
    return;
  }

  updateGpsBadge('ACQUIRING...', 'badge-static');

  navigator.geolocation.getCurrentPosition(
    (pos) => handleGpsUpdate(pos),
    (err) => handleGpsError(err),
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
  );

  STATE.gps.watchId = navigator.geolocation.watchPosition(
    (pos) => handleGpsUpdate(pos),
    (err) => handleGpsError(err),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
  );
}

function handleGpsUpdate(position) {
  STATE.gps.active = true;
  STATE.gps.lat = position.coords.latitude;
  STATE.gps.lon = position.coords.longitude;

  const latSpan = document.getElementById('telemetry-gps-lat');
  const lonSpan = document.getElementById('telemetry-gps-lon');

  if (latSpan) latSpan.textContent = position.coords.latitude.toFixed(4);
  if (lonSpan) lonSpan.textContent = position.coords.longitude.toFixed(4);
  updateGpsBadge('LIVE GPS', 'badge-live');

  // Query live weather through server
  callServer('getLiveConditions', position.coords.latitude, position.coords.longitude)
    .then((cond) => {
      if (cond && cond.weather && cond.weather.status === 'LIVE') {
        const tempEl = document.getElementById('telemetry-weather-temp');
        if (tempEl) tempEl.textContent = `${cond.weather.temperatureC}°C, ${cond.weather.condition}`;
      }
    })
    .catch((err) => console.warn('Live weather poll warning:', err));
}

function handleGpsError(err) {
  let label = 'GPS ERROR';
  if (err.code === 1) label = 'GPS DENIED';
  else if (err.code === 2) label = 'GPS UNAVAILABLE';
  else if (err.code === 3) label = 'GPS TIMEOUT';
  updateGpsBadge(label, 'badge-critical');
}

function updateGpsBadge(label, className) {
  const badge = document.getElementById('telemetry-gps-badge');
  if (badge) {
    badge.className = `badge ${className}`;
    badge.textContent = label;
  }
}

function switchAlgoLab(algo) {
  STATE.algoLab.selectedAlgo = algo;
  document.querySelectorAll('.algo-btn').forEach((b) => {
    b.classList.toggle('active', b.getAttribute('data-algo') === algo);
  });
  runAlgoLabCalculation();
}

function runAlgoLabCalculation() {
  const algo = STATE.algoLab.selectedAlgo;
  const graph = STATE.graph;

  if (algo === 'dijkstra') {
    const res = runLocalDijkstra(graph, 'B01', null);
    STATE.algoLab.result = res;
    STATE.algoLab.steps = res.path.map((nodeId, idx) => ({
      step: idx + 1,
      title: `Visit Node ${nodeId}`,
      detail: `Settled with shortest path cost`,
    }));
  } else if (algo === 'kruskal') {
    const edges = [...graph.edges].sort((a, b) => a.distance - b.distance);
    STATE.algoLab.steps = edges.slice(0, 20).map((e, idx) => ({
      step: idx + 1,
      title: `Evaluate Edge ${e.id} (${e.distance}m)`,
      detail: `${e.source} -> ${e.target}`,
    }));
  }

  STATE.algoLab.stepIndex = 0;
  updateAlgoLabUi();
}

function updateAlgoLabUi() {
  const steps = STATE.algoLab.steps || [];
  const curr = STATE.algoLab.stepIndex;
  const logEl = document.getElementById('algo-step-log');
  if (logEl) {
    logEl.innerHTML = steps.map((s, idx) => `
      <div style="padding:6px 8px;border-radius:4px;margin-bottom:4px;background:${idx === curr ? 'var(--primary-soft)' : 'transparent'};border-left:3px solid ${idx === curr ? 'var(--primary)' : 'transparent'};font-size:0.78rem;">
        <strong>Step ${s.step}:</strong> ${escapeHtml(s.title)} - <span style="color:var(--text-muted);">${escapeHtml(s.detail)}</span>
      </div>
    `).join('');
  }
}

function stepAlgoLab(dir) {
  const max = (STATE.algoLab.steps || []).length - 1;
  STATE.algoLab.stepIndex = Math.max(0, Math.min(max, STATE.algoLab.stepIndex + dir));
  updateAlgoLabUi();
}
